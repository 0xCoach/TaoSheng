# 贡献者许可协议（CLA）机器人：首次提 PR 时请贡献者在 PR 下回复签署语句。
# 安全：pull_request_target 带写权限运行在本仓库上下文，本流程只调用 CLA 机器人，
# 绝不能加入 checkout / 运行 PR 代码的步骤。
name: "CLA"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # v2.6.1，固定到提交，避免标签被改动
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/0xCoach/TaoSheng/blob/main/CLA.md'
          path-to-signatures: 'signatures/version1/cla.json'
          # 签名单独存一个不受保护的分支，不进主分支历史
          branch: 'cla-signatures'
          allowlist: 0xCoach,bot*,dependabot[bot]
          custom-notsigned-prcomment: |
            感谢你的贡献！合入前请先阅读 [贡献者许可协议（CLA）](https://github.com/0xCoach/TaoSheng/blob/main/CLA.md)，同意的话在本 PR 下回复下面这句话（同一账号只需签一次）。你保留自己贡献的著作权。

            Thanks for your contribution! Before we can merge, please read the [Contributor License Agreement](https://github.com/0xCoach/TaoSheng/blob/main/CLA.md) and, if you agree, reply on this PR with the sentence below (once per account). You keep the copyright in your work.
          custom-allsigned-prcomment: '所有贡献者都已签署 CLA，谢谢！ · All contributors have signed the CLA. Thank you!'
          signed-commit-message: '$contributorName 在 #$pullRequestNo 签署了 CLA'
          create-file-commit-message: '创建 CLA 签名记录'
