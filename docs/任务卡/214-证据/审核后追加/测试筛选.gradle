allprojects { tasks.withType(Test).configureEach {
    if (project.name == 'shared') filter { includeTestsMatching 'app.resound.recordings.RecordingKeep214Test' }
    if (project.name == 'app') filter {
        includeTestsMatching 'app.resound.recordings.Recording214Test'
        includeTestsMatching 'app.resound.recordings.RecordingArchive072Test'
        includeTestsMatching 'app.resound.push.LocalFolder214Test'
    }
} }
