name: iOS 编译检查

on:
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'devices/**'
      - 'tools/check_ios.sh'
      - '**/*.gradle.kts'
      - '**/*.gradle'
      - '**/gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
  pull_request:
    paths:
      - 'shared/**'
      - 'devices/**'
      - 'tools/check_ios.sh'
      - '**/*.gradle.kts'
      - '**/*.gradle'
      - '**/gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      TAOSHENG_GRADLE_REGISTRY: /tmp/taosheng-166-gradle
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
      # 脚本自动寻找 /Applications/Xcode*.app，必要时可用 TAOSHENG_XCODE 指定。
      - name: 检查 iOS 真机与模拟器编译
        run: zsh tools/check_ios.sh
