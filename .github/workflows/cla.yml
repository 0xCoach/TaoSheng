# CLA 机器人：请尚未签署 2.0 版的贡献者在 PR 下回复签署语句。
# 安全：pull_request_target 带写权限运行在本仓库上下文，本流程只调用 CLA 机器人，
# 绝不能加入 checkout / 运行 PR 代码的步骤。
name: "CLA"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I agree to the TaoSheng CLA v2.0 and its copyright assignment terms') || github.event_name == 'pull_request_target'
        # v2.6.1，固定到提交，避免标签被改动
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/0xCoach/TaoSheng/blob/${{ github.sha }}/CLA.md'
          path-to-signatures: 'signatures/version2/cla.json'
          custom-pr-sign-comment: 'I agree to the TaoSheng CLA v2.0 and its copyright assignment terms'
          # 签名单独存一个不受保护的分支，不进主分支历史
          branch: 'cla-signatures'
          allowlist: 0xCoach,dependabot[bot]
          custom-notsigned-prcomment: |
            感谢你的贡献！合入前请先阅读 [贡献者协议（CLA 2.0）](https://github.com/0xCoach/TaoSheng/blob/${{ github.sha }}/CLA.md)，**你提交的代码合入时，你享有且依法可转让的著作财产权将无偿转让给维护者 0xCoach 本人。** 同意的话在本 PR 下回复下面这句话（每个账号签署 2.0 版一次）。

            Thanks for your contribution! Before we can merge, please read the [Contributor Agreement (CLA v2.0)](https://github.com/0xCoach/TaoSheng/blob/${{ github.sha }}/CLA.md). **When your code is merged, the copyright economic rights you own and can legally transfer in it pass to 0xCoach personally, free of charge.** If you agree, reply on this PR with the sentence below (once per account for v2.0).
          custom-allsigned-prcomment: '所有贡献者都已签署 CLA 2.0，谢谢！ · All contributors have signed CLA v2.0. Thank you!'
          signed-commit-message: '$contributorName 在 #$pullRequestNo 签署了 CLA 2.0'
          create-file-commit-message: '创建 CLA 2.0 签名记录'
