name: Android 检查

on:
  push:
    branches: [main]
  pull_request:

# 外部贡献者的 PR 也可执行，不读取密钥、不写仓库。
permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
      # 使用 GitHub runner 自带的 Android SDK；本机路径不进仓库。
      - name: 配置 Android SDK
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: 检查共用边界
        run: python3 tools/check_shared.py
      - name: 检查设备边界
        run: python3 tools/check_devices.py
      # 在完整编译之前单跑 KSP，持续覆盖卡 166 报告的独立入口。
      - name: 单独检查 KSP
        run: ./gradlew -Dorg.gradle.daemon.registry.base=/tmp/taosheng-166-gradle -PskipSigningSecrets=true :app:kspDebugKotlin
      # 不设置 TAOSHENG_LIVE_THINGS 等真实服务开关，相应测试按条件跳过。
      - name: 编译与单测
        run: ./gradlew -Dorg.gradle.daemon.registry.base=/tmp/taosheng-166-gradle -PskipSigningSecrets=true :shared:check :shared:jvmTest :devices:check :app:compileDebugKotlin :app:testDebugUnitTest
      - name: 保留失败测试报告
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests
            shared/build/reports/tests
          if-no-files-found: ignore
